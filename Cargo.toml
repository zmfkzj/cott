[package]
name = "cott"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[dependencies]
jsonschema = "0.37"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
tokio = { version = "1", default-features = false, features = ["io-std", "rt-multi-thread", "sync"] }
tower-lsp = "0.20"
