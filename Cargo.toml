[package]
name = "cott"
version = "1.0.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[dependencies]
flate2 = "1"
getrandom = "0.3"
hmac = "0.12"
jsonschema = "0.37"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
serde_yaml_ng = "0.10"
sha2 = "0.10"
tar = "0.4"
toml = "0.8"
tokio = { version = "1", default-features = false, features = ["io-std", "rt-multi-thread", "sync"] }
tower-lsp = "0.20"
rustpython-parser = "0.4"
tree-sitter = "0.27"
tree-sitter-dart = "0.2"
tree-sitter-kotlin-ng = "1.1"
