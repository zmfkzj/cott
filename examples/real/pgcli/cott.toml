[project]
name = "real-pgcli"
version = "0.1.0"
source = "src"

[target.python]
source = "python"
generated = "generated/python"
stubs = "generated/stubs"
lockfile = "python/uv.lock"
interpreter = ".venv/bin/python"
type_checker = ".venv/bin/basedpyright"
runtime_validation = "boundary"

[generator]
rules = "generator.rules"
timeout_seconds = 3600

[verification.fixtures]
scenario_timeout_ms = 10000
filesystem_bytes = 67108864
filesystem_files = 4096

[[verification.coverage.rules]]
symbol = "real.pgcli.cli.parse_pgcli_arguments"
clauses = ["ensures:1", "error:2"]
allow_unobserved = false
allow_trust_declaration = false
allow_unknown = false

