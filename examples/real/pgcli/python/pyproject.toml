[project]
name = "real-pgcli"
version = "0.1.0"
requires-python = ">=3.14.6,<3.15"
dependencies = [
    "pgspecial>=2.2.1",
    "click>=8.3.1,<9",
    "Pygments>=2.19",
    "prompt_toolkit>=3.0.52,<4",
    "psycopg[binary]>=3.2,<4",
    "sqlparse>=0.5,<0.7",
    "configobj>=5.0.9",
    "cli_helpers[styles]>=2.4.0",
    "setproctitle>=1.3.7",
    "tzlocal>=5.3",
    "keyring>=25.7.0",
    "sshtunnel>=0.4.0",
    "paramiko>=3.5,<4",
]

[dependency-groups]
dev = ["basedpyright==1.39.9"]
