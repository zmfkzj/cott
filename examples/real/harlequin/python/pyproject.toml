[project]
name = "harlequin"
version = "0.1.0"
requires-python = ">=3.14.6,<3.15"
dependencies = [
    "adbc-driver-manager",
    "boto3",
    "cassandra-driver",
    "databricks-sql-connector",
    "duckdb",
    "google-cloud-bigquery",
    "nebula3-python",
    "psycopg[binary]",
    "pymysql",
    "pyodbc",
    "textual",
    "trino",
]

[project.scripts]
harlequin-cott = "harlequin_cli:main"

[dependency-groups]
dev = ["basedpyright==1.39.9"]
