[project]
name = "harlequin"
version = "0.1.0"
source = "src"

[target.python]
source = "python"
lockfile = "python/uv.lock"
generated = "generated/python"
stubs = "generated/stubs"
interpreter = ".venv/bin/python"
type_checker = ".venv/bin/basedpyright"
runtime_validation = "test-only"

[effects]
"clipboard" = true
"locale" = true
"subprocess" = true
"tty" = true

[generator]
rules = "generator.rules"
timeout_seconds = 3600

[[verification.coverage.rules]]
symbol = "real.harlequin.hsql.parse_hsql_arguments"
clauses = ["ensures:1", "error:2"]
allow_unobserved = false
allow_trust_declaration = false
allow_unknown = false

