[target.python.implementations]
"curriculum.trait_protocol.default_category" = "cott_bindings.curriculum.trait_protocol.default_category:default_category"
"curriculum.trait_protocol.specialized_display" = "cott_bindings.curriculum.trait_protocol.specialized_display:specialized_display"
"curriculum.trait_protocol.task_factory" = "cott_bindings.curriculum.trait_protocol.task_factory:task_factory"
"curriculum.trait_protocol.inspect_dyn" = "cott_bindings.curriculum.trait_protocol.inspect_dyn:inspect_dyn"

[generator]
rules = "GENERATOR_RULES.txt"
