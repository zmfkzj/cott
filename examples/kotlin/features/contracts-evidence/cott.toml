[project]
name = "contracts-evidence"
version = "0.1.0"
source = "src"

[target.kotlin]
source = "kotlin"
generated = "generated/kotlin"
compiler = "kotlinc"
java = "java"
jvm_target = 17
runtime_validation = "boundary"

[verification]
proof_node_limit = 257
proof_branch_limit = 65
candidate_limit = 17
lifecycle_limit = 5

[[verification.coverage.rules]]
symbol = "curriculum.contracts_evidence.assess_label"
clauses = ["ensures:2", "error:5", "error:6"]
allow_unobserved = false
allow_trust_declaration = false
allow_unknown = false
